root_path: ${oc.env:PROJECT_ROOT}/data/alx_1D
prop: energy_per_atom
num_targets: 1
niggli: true
primitive: false
graph_method: crystalnn
lattice_scale_method: scale_length
preprocess_workers: 30
readout: mean
# Alexandria 1D nanotubes run large: the template cache ceiling is 64 atoms
# (data/alx_1D/build_templates.py MAX_NATM). Keep this in sync with build_train_csv.py.
max_atoms: 64
otf_graph: false
eval_model_name: mp20
tolerance: 0.1

use_space_group: false
use_pos_index: false
train_max_epochs: 4000
early_stopping_patience: 100000
teacher_forcing_max_epoch: 1000


datamodule:
  _target_: scigen.pl_data.datamodule.CrystDataModule

  datasets:
    train:
      _target_: scigen.pl_data.dataset.CrystDataset
      name: Alexandria 1D nanotubes train
      path: ${data.root_path}/train.csv
      save_path: ${data.root_path}/train_ori.pt
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      tolerance: ${data.tolerance}
      use_space_group: ${data.use_space_group}
      use_pos_index: ${data.use_pos_index}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}

    val:
      - _target_: scigen.pl_data.dataset.CrystDataset
        name: Alexandria 1D nanotubes val
        path: ${data.root_path}/val.csv
        save_path: ${data.root_path}/val_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

    test:
      - _target_: scigen.pl_data.dataset.CrystDataset
        name: Alexandria 1D nanotubes test
        path: ${data.root_path}/test.csv
        save_path: ${data.root_path}/test_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

  num_workers:
    train: 0
    val: 0
    test: 0

  batch_size:
    train: 128
    val: 128
    test: 256
