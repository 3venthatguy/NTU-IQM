_target_: scigen.pl_modules.diffusion_w_type.CSPDiffusion
time_dim: 256
latent_dim: 0
cost_coord: 1.
cost_lattice: 1.
cost_type: 20.
max_neighbors: 20  # maximum number of neighbors for OTF graph bulding in decoder
radius: 7.  # maximum search radius for OTF graph building in decoder
timesteps: 1000

# --- Constrained-sampling controls (sc='shl' nanotube generation) -------------
# These document the knobs for progressive skeleton pinning and the cylindrical
# radial envelope. NOTE: at generation time the sampler reads these off runtime
# attributes set on the loaded model (model.pin_cfg / model.cyl_cfg in
# script/generation.py and ntgen_generation.ipynb), because a pretrained
# checkpoint's self.hparams are frozen at training time. The values here are the
# documented defaults the CLI/notebook forward, and defaults for future retraining.
progressive_skeleton_pinning:
  enabled: false          # true -> ramp the skeleton mask via psi(t) instead of binary pinning
  schedule: sigmoid       # 'linear' | 'sigmoid' | 'none'
  alpha: 10.0             # sigmoid steepness
  t_mid_frac: 0.6         # sigmoid inflection point as a fraction of T
  psi_start: 0.0          # pinning strength at t=T (0 -> start from noise, in-distribution)
  psi_end: 1.0            # pinning strength at t=0 (1 -> skeleton fully pinned)
cylindrical_masking:
  enabled: false          # true -> softly confine atoms to the tube's radial band
  margin: 0.1             # r_hi = r_max * (1 + margin); outer headroom
  r_lo_percentile: 5.0    # inner band edge percentile (sc='shl' shell only)
  max_strength: 1.0       # peak radial pull (scaled by psi(t) each step)
  # Band semantics: sc='shl' uses the two-sided band [r_min, r_max*(1+margin)]
  # to confine EVERY generated atom onto the wall shell (no atoms pinned).
radial_density_guidance:  # v2: concentrate atoms onto the wall WITHIN the band
  enabled: false          # true -> nudge each atom up d/dr log rho(r) toward the wall
  density_strength: 0.05  # radial step scale for the guidance force (scaled by psi(t))
  bandwidth_scale: 1.0    # KDE bandwidth multiplier = empirical wall thickness (<1 sharpens)
  grid_size: 96           # force-table resolution per template
  force_clip: null        # per-step radial-force cap (null -> auto = 5/bandwidth)
  # Runtime reads model.dens_cfg (see generation.py / notebook). Layered on top of
  # the band above: the band confines to [r_lo, r_hi], the density force shapes a
  # filled disk into a thin wall (single- or double-wall handled by rho(r)'s modes).

defaults:
  - decoder: cspnet
  - beta_scheduler: cosine
  - sigma_scheduler: wrapped
